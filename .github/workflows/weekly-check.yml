name: Weekly funding check

# Every Monday: check each call's page and the UKRI feed, then rebuild the site.
# Quiet weeks (only dates changed, nothing needs a person) publish themselves.
# Anything else opens a "Weekly funding check" pull request for review,
# and GitHub notifies you about it.

on:
  schedule:
    - cron: "45 6 * * 1"   # Mondays 06:45 UTC (07:45 UK summer time, 06:45 winter)
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

env:
  AUTO_PUBLISH: "true"      # set to "false" to always get a pull request instead

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check every source page (no AI)
        run: python3 scripts/check_sources.py

      - name: Look for new calls in the UKRI feed (no AI)
        run: python3 scripts/new_calls.py

      - name: Draft entries for new calls (optional, uses the Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python3 scripts/ai_draft.py

      - name: Check the data and build site/
        run: python3 scripts/build_site.py

      - name: Decide whether this week can publish itself
        id: decide
        run: python3 scripts/decide.py

      - name: Quiet week - publish straight away
        if: steps.decide.outputs.quiet == 'true'
        run: |
          git config user.name "funding-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site reports proposals
          git commit -m "Weekly funding check (published automatically)" || echo "Nothing changed."
          git push

      - name: Needs a person - open a pull request
        if: steps.decide.outputs.quiet != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: weekly-check
          delete-branch: true
          commit-message: "Weekly funding check"
          title: "Weekly funding check: needs a look"
          body-path: reports/latest.md
          labels: weekly-check
          assignees: RobMdx
