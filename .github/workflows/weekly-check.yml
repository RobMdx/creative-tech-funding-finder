name: Weekly funding check

on:
  schedule:
    - cron: "45 6 * * 1"   # Mondays 06:45 UTC (07:45 UK summer time, 06:45 winter)
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check every source page (no AI)
        run: python3 scripts/check_sources.py

      - name: Look for new calls in the UKRI feed (no AI)
        run: python3 scripts/new_calls.py

      - name: List open reports from site visitors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo ""
            echo "## Reports from visitors (open issues labelled 'report')"
            echo ""
            gh issue list --label report --state open --limit 50 \
              --json number,title,url --template '{{range .}}- [#{{.number}} {{.title}}]({{.url}}){{"\n"}}{{end}}' || echo "_Could not read issues._"
            echo ""
            echo "Check each against the funder's page. Close the issue once it's dealt with."
          } >> reports/latest.md

      - name: Draft entries for new calls (optional, uses the Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python3 scripts/ai_draft.py

      - name: Check the data and build site/
        run: python3 scripts/build_site.py

      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@v8
        with:
          branch: weekly-check
          delete-branch: true
          commit-message: "Weekly funding check"
          title: "Weekly funding check"
          body-path: reports/latest.md
          labels: weekly-check
